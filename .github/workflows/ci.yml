name: CI

# Runs the same suite Antonio runs locally before every commit, so a
# collaborator's PR can't merge until it proves it keeps things green.
# Triggers: every push to any branch + every PR targeting dev or main.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]

concurrency:
  # A new push to the same branch cancels the previous run — prevents
  # queue build-up on rapid pushes during active dev.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # `.[api,dev]` pulls FastAPI, uvicorn, pytest, pytest-asyncio, and
        # all runtime deps declared in pyproject.toml. No separate
        # requirements.txt to drift.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Run pytest
        run: python -m pytest --tb=short

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run vitest
        run: npx vitest run
