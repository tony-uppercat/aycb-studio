<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AYCB</title>
  </head>
  <body>
    <div id="root">
      <div id="app-loader" style="
        display:flex;flex-direction:column;align-items:center;justify-content:center;

      ">
        <div style="font-size:20px;font-weight:700;color:#f59e0b;margin-bottom:12px;">AYCB</div>
        <div style="font-size:13px;">Loading canvas...</div>
        <div style="margin-top:16px;width:40px;height:40px;border:3px solid #27272a;border-top-color:#f59e0b;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
