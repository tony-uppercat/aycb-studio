[project]
name = "aycb"
version = "1.0.0"
description = "Lean cinematic image/video analyzer powered by Gemini 2.0 Flash + Embedding 2"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.33",
    "anthropic>=0.40",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "typer[all]>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-socketio[asyncio]>=5.10,<6.0",
    "aiosqlite>=0.20,<1.0",
]
local = [
    "torch>=2.4",
    "diffusers>=0.30",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.3,<2.0",
]

[project.scripts]
aycb = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
